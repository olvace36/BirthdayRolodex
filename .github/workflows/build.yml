name: Build BirthdayRolodex

on:
  push:
    branches: [ prod ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Main mod repo (your fork)
      - name: Checkout BirthdayRolodex
        uses: actions/checkout@v4
        with:
          path: BirthdayRolodex

      # Sibling dependency required by the .csproj's
      # <Import Project="..\TowerCore\TowerCore.msbuild" />
      - name: Checkout TowerCore
        uses: actions/checkout@v4
        with:
          repository: olvace36/TowerCore
          ref: prod
          path: TowerCore

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Build
        working-directory: BirthdayRolodex
        run: dotnet build -c Release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BirthdayRolodex
          path: BirthdayRolodex/bin/Release/net6.0/*

