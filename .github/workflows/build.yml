name: Build BirthdayRolodex

on:
  push:
    branches: [ prod ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Main mod repo (your fork)
      - name: Checkout BirthdayRolodex
        uses: actions/checkout@v4
        with:
          path: BirthdayRolodex

      # Sibling dependency required by the .csproj's
      # <Import Project="..\TowerCore\TowerCore.msbuild" />
      - name: Checkout TowerCore
        uses: actions/checkout@v4
        with:
          repository: olvace36/TowerCore
          ref: prod
          path: TowerCore

      # Reuse the same libs/ folder (StardewValley.dll, MonoGame.Framework.dll,
      # StardewModdingAPI.dll, 0Harmony.dll, xTile.dll) you already maintain
      # for lookup-anything-mobile-search / sns-android-fix, instead of
      # duplicating it by hand in this repo.
      - name: Checkout libs/
        uses: actions/checkout@v4
        with:
          repository: olvace36/lookup-anything-mobile-search
          ref: main
          path: libs-source
          sparse-checkout: |
            libs
          sparse-checkout-cone-mode: false

      - name: Place libs/ next to the csproj
        run: cp -r libs-source/libs BirthdayRolodex/libs

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Build
        working-directory: BirthdayRolodex
        run: dotnet build -c Release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BirthdayRolodex
          path: BirthdayRolodex/bin/Release/net9.0/*
