name: Build BirthdayRolodex

on:
  push:
    branches: [ prod ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Main mod repo (your fork) - unmodified from upstream
      - name: Checkout BirthdayRolodex
        uses: actions/checkout@v4
        with:
          path: BirthdayRolodex

      # Sibling dependency required by the .csproj's
      # <Import Project="..\TowerCore\TowerCore.msbuild" />
      - name: Checkout TowerCore
        uses: actions/checkout@v4
        with:
          repository: olvace36/TowerCore
          ref: prod
          path: TowerCore

      # Reuse the Android game assemblies already committed in sns-android-fix
      # (StardewValley.dll, StardewModdingAPI.dll, MonoGame.Framework.dll,
      # 0Harmony.dll, xTile.dll live at its repo root) instead of duplicating
      # them here. ModBuildConfig will use this folder via GamePath below.
      - name: Checkout Android game assemblies
        uses: actions/checkout@v4
        with:
          repository: olvace36/sns-android-fix
          ref: main
          path: game-assemblies
          sparse-checkout: |
            StardewValley.dll
            StardewModdingAPI.dll
            MonoGame.Framework.dll
            0Harmony.dll
            xTile.dll
          sparse-checkout-cone-mode: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Build
        working-directory: BirthdayRolodex
        # ModBuildConfig normally auto-detects the game install; in CI there
        # isn't one, so we point it at the Android assemblies checked out above.
        run: >
          dotnet build -c Release
          -p:GamePath="${{ github.workspace }}/game-assemblies"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BirthdayRolodex
          path: BirthdayRolodex/bin/Release/net6.0/*
          
